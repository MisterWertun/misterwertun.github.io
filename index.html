<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantAI - Определитель растений</title>
    <style>
        body { font-family: -apple-system, sans-serif; line-height: 1.6; max-width: 750px; margin: 0 auto; padding: 20px; background: #0a1a0a; color: #e0e0e0; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #2a4a2a; }
        h1 { color: #4ade80; margin-bottom: 10px; }
        .upload-box { background: #1a2e1a; border: 2px dashed #4ade80; border-radius: 16px; padding: 40px 20px; text-align: center; margin: 30px 0; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { background: #1f3a1f; }
        .upload-box input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 10px; }
        .btn { display: inline-block; background: #4ade80; color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; border: none; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background: #22c55e; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .result { display: none; background: #1a2e1a; padding: 20px; border-radius: 12px; border: 1px solid #4ade80; margin-top: 20px; animation: fadeIn 0.5s; }
        .result h2 { color: #4ade80; margin-top: 0; }
        .result ul { padding-left: 20px; }
        .result li { margin-bottom: 10px; }
        .preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 15px; display: none; }
        .error { color: #ef4444; margin-top: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        footer { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <h1>🌿 PlantAI</h1>
        <p>Интеллектуальный определитель растений по фото</p>
    </header>

    <div class="upload-box" onclick="document.getElementById('fileInput').click();">
        <div class="upload-icon">📸</div>
        <p>Нажми, чтобы выбрать фото растения</p>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview" alt="Превью">
    </div>

    <div style="text-align: center;">
        <button class="btn" id="analyzeBtn" onclick="analyzePlant()">🔍 Определить растение</button>
    </div>

    <div id="resultBox" class="result">
        <h2>Результат анализа</h2>
        <ul id="resultList"></ul>
        <p style="font-size: 12px; color: #888; margin-top: 15px;">* Результаты предоставлены нейросетью Pl@ntNet.</p>
    </div>
    
    <div id="errorBox" class="error" style="text-align: center;"></div>

    <footer>© 2026</footer>

    <script>
        let selectedFile = null;

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('preview');
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function analyzePlant() {
            if (!selectedFile) {
                document.getElementById('errorBox').textContent = 'Сначала выбери фото!';
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const resultBox = document.getElementById('resultBox');
            const resultList = document.getElementById('resultList');
            const errorBox = document.getElementById('errorBox');

            btn.disabled = true;
            btn.textContent = 'Анализ... (ждем ответ от ИИ)';
            resultBox.style.display = 'none';
            errorBox.textContent = '';

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('organ', 'auto');

            try {
                const response = await fetch('https://plant-ai-proxy.trustinv52.workers.dev', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка сервера');
                }

                if (data.results && data.results.length > 0) {
                    resultList.innerHTML = '';
                    data.results.slice(0, 3).forEach(item => {
                        const li = document.createElement('li');
                        const score = Math.round(item.score * 100);
                        const commonName = item.species.commonNames && item.species.commonNames.length > 0 ? item.species.commonNames[0] : 'Русское название не найдено';
            li.innerHTML = `<strong>${commonName}</strong><br>(лат. <em>${item.species.scientificNameWithoutAuthor}</em>)<br><span style="color:#86efac; font-size: 14px;">Совпадение: ${score}%</span>`;
                        resultList.appendChild(li);
                    });
                    resultBox.style.display = 'block';
                } else {
                    errorBox.textContent = 'Не удалось распознать растение. Попробуй другое фото.';
                }

            } catch (error) {
                errorBox.textContent = 'Ошибка: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Определить растение';
            }
        }
    </script>
</body>
</html>
