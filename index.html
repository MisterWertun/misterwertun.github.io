<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantAI - Определитель растений</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            line-height: 1.6; 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #051005 0%, #0a1a0a 100%); 
            color: #e0e0e0; 
            min-height: 100vh;
        }
        
        header { text-align: center; padding: 40px 0; margin-bottom: 20px; }
        h1 { color: #4ade80; margin-bottom: 10px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-shadow: 0 4px 15px rgba(74, 222, 128, 0.2); }
        p.subtitle { color: #86efac; font-size: 16px; }

        .upload-box { 
            background: rgba(26, 46, 26, 0.6); border: 2px dashed #4ade80; border-radius: 20px; 
            padding: 40px 20px; text-align: center; margin: 30px 0; cursor: pointer; 
            transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px);
        }
        .upload-box:hover { background: rgba(31, 58, 31, 0.8); transform: translateY(-2px); }
        .upload-box input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.4)); }
        
        .btn { 
            display: inline-block; background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); 
            color: #000; padding: 16px 24px; border-radius: 12px; font-weight: 600; 
            border: none; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; 
            transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .result { 
            display: none; background: rgba(26, 46, 26, 0.8); padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(74, 222, 128, 0.3); margin-top: 30px; 
            animation: fadeIn 0.6s ease-out; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
        }
        .result h2 { color: #4ade80; margin-top: 0; font-weight: 800; border-bottom: 1px solid rgba(74, 222, 128, 0.2); padding-bottom: 10px; }
        .result ul { padding-left: 20px; }
        .result li { margin-bottom: 15px; font-size: 18px; }
        .result li strong { color: #fff; }
        .result li em { color: #86efac; }
        
        .preview { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .error { color: #f87171; margin-top: 15px; font-weight: 600; text-align: center; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        footer { text-align: center; color: #555; padding: 40px 0 20px 0; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <h1>🌿 PlantAI</h1>
        <p class="subtitle">Интеллектуальный определитель растений</p>
    </header>

    <div class="upload-box" onclick="document.getElementById('fileInput').click();">
        <div class="upload-icon">📸</div>
        <p>Нажми, чтобы выбрать фото растения</p>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview" alt="Превью">
    </div>

    <div style="text-align: center;">
        <button class="btn" id="analyzeBtn" onclick="analyzePlant()">🔍 Определить растение</button>
        <button id="voiceToggle" class="btn" style="background: transparent; color: #4ade80; border: 2px solid #4ade80; box-shadow: none; margin-top: 10px;" onclick="toggleVoice()">🔇 Голос выключен</button>
    </div>

    <div id="resultBox" class="result">
        <h2>Результат анализа</h2>
        <ul id="resultList"></ul>
        <p style="font-size: 12px; color: #888; margin-top: 20px; text-align: center;">* Результаты предоставлены нейросетью Pl@ntNet.</p>
    </div>
    
    <div id="errorBox" class="error"></div>
    <footer>© 2026</footer>

    <script>
        let selectedFile = null;
        let isVoiceEnabled = false;

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            const btn = document.getElementById('voiceToggle');
            if (isVoiceEnabled) {
                btn.innerHTML = '🔊 Голос включен';
                btn.style.background = 'rgba(74, 222, 128, 0.2)';
            } else {
                btn.innerHTML = '🔇 Голос выключен';
                btn.style.background = 'transparent';
                window.speechSynthesis.cancel();
            }
        }

        function speakPlant(name) {
            if (!isVoiceEnabled) return;
            window.speechSynthesis.cancel();
            const text = `Растение определено. Это ${name}.`;
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.includes('ru'));
            if (ruVoice) utterance.voice = ruVoice;
            utterance.rate = 1.0;
            utterance.pitch = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('preview');
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function analyzePlant() {
            if (!selectedFile) {
                document.getElementById('errorBox').textContent = 'Сначала выбери фото!';
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const resultBox = document.getElementById('resultBox');
            const resultList = document.getElementById('resultList');
            const errorBox = document.getElementById('errorBox');

            btn.disabled = true;
            btn.textContent = 'Анализ... (ждем ИИ)';
            resultBox.style.display = 'none';
            errorBox.textContent = '';

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('organ', 'auto');

            try {
                const response = await fetch('https://plant-ai-proxy.trustinv52.workers.dev', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Ошибка сервера');

                if (data.results && data.results.length > 0) {
                    resultList.innerHTML = '';
                    data.results.slice(0, 3).forEach((item, index) => {
                        const li = document.createElement('li');
                        const score = Math.round(item.score * 100);
                        const commonName = item.species.commonNames && item.species.commonNames.length > 0 ? item.species.commonNames[0] : 'Русское название не найдено';
                        
                        li.innerHTML = `<strong>${commonName}</strong><br>(лат. <em>${item.species.scientificNameWithoutAuthor}</em>)<br><span style="color:#86efac; font-size: 14px;">Совпадение: ${score}%</span>`;
                        resultList.appendChild(li);

                        // Озвучиваем только первый результат, если голос включен
                        if (index === 0 && isVoiceEnabled) {
                            speakPlant(commonName);
                        }
                    });
                    resultBox.style.display = 'block';
                } else {
                    errorBox.textContent = 'Не удалось распознать растение. Попробуй другое фото.';
                }

            } catch (error) {
                errorBox.textContent = 'Ошибка: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Определить растение';
            }
        }
    </script>
</body>
</html>
